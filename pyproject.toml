[project]
name = "nl-supermarkt-mcp"
version = "0.2.0"
description = "MCP server voor Nederlandse supermarktprijzen - vergelijk prijzen, bekijk aanbiedingen, converteer recepten en vind winkels in de buurt"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["mcp", "supermarket", "prices", "netherlands", "albert-heijn", "jumbo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

dependencies = [
    "mcp>=1.0.0,<3.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "sse-starlette>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Harvester57/nl-supermarkt-mcp"
Repository = "https://github.com/Harvester57/nl-supermarkt-mcp.git"
Issues = "https://github.com/Harvester57/nl-supermarkt-mcp/issues"

[project.scripts]
nl-supermarkt-mcp = "src.server:cli_main"
nl-supermarkt-mcp-sse = "src.server_sse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
